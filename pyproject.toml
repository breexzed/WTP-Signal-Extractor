[project]
name = "wtp-signal-extractor"
version = "0.5.0"
description = "Extract willingness-to-pay and go-to-market signals from transcripts with schema-enforced LLM output and quote verification. Built for AI agents: --describe, --json, exit codes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.13.0",
    "openai>=1.82.0",
    "python-dotenv>=1.2.2",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Repository = "https://github.com/breexzed/WTP-Signal-Extractor"

[project.scripts]
wtp = "wtp.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wtp"]
