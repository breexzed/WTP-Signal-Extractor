[project]
name = "wtp-signal-extractor"
version = "0.6.2"
description = "Extract willingness-to-pay and go-to-market signals from transcripts with schema-enforced LLM output and quote verification. Built for AI agents: --describe, --json, exit codes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Breexzed", email = "breexzed@outlook.com" }]
keywords = ["willingness-to-pay", "customer-research", "llm", "cli", "transcripts", "ai-agents", "structured-output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=1.13.0",
    "openai>=1.82.0",
    "python-dotenv>=1.2.2",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Repository = "https://github.com/breexzed/WTP-Signal-Extractor"
Issues = "https://github.com/breexzed/WTP-Signal-Extractor/issues"
Changelog = "https://github.com/breexzed/WTP-Signal-Extractor/blob/main/CHANGELOG.md"

[project.scripts]
wtp = "wtp.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wtp"]

[tool.ruff]
target-version = "py311"
line-length = 110
